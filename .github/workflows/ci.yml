name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Verify Java project
        run: ./mvnw --batch-mode --no-transfer-progress verify
      - name: Validate n8n workflow JSON
        run: jq empty n8n/workflows/*.json
      - name: Validate Compose model
        run: docker compose config --quiet
